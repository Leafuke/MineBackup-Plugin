name: MineBackupPlugin
version: '${version}'
main: com.leafuke.minebackup.plugin.MineBackupPlugin
api-version: '1.21'
description: Safe FolderRewind integration for Spigot and Paper servers
author: Leafuke

commands:
  mb:
    description: MineBackup administration command
    usage: /mb help
    permission: minebackup.command

permissions:
  minebackup.command:
    description: Allows all MineBackup operations
    default: op
