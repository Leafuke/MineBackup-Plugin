name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            java: '21'
            spigot: 1.21.1-R0.1-SNAPSHOT
          - os: ubuntu-latest
            java: '21'
            spigot: 1.21.11-R0.1-SNAPSHOT
          - os: ubuntu-latest
            java: '25'
            spigot: 26.1.2-R0.1-SNAPSHOT
          - os: windows-latest
            java: '21'
            spigot: 1.21.1-R0.1-SNAPSHOT
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle
      - uses: gradle/actions/wrapper-validation@v4
      - name: Test and build
        shell: bash
        run: ./gradlew clean test build --no-daemon -PspigotApiVersion=${{ matrix.spigot }}

  artifact:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build release artifact
        run: ./gradlew clean build --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: MineBackupPlugin
          path: build/libs/*.jar
          if-no-files-found: error
